<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Centro de Control</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink: #FFFFFF;
    --ink-dim: rgba(255,255,255,0.72);
    --ink-faint: rgba(255,255,255,0.48);
    --panel: rgba(16,16,26,0.40);
    --panel-solid: rgba(13,12,20,0.88);
    --border: rgba(255,255,255,0.16);
    --border-soft: rgba(255,255,255,0.09);
    --shadow-ink: rgba(6,6,14,0.45);

    --c-comercial: #8B85FF;
    --c-comercial-2: #4E4FD1;
    --c-appsheet: #2FE3C6;
    --c-appsheet-2: #0EA5A0;
    --c-norden: #FFB020;
    --c-norden-2: #F0723C;
    --c-bimo: #FF7AC1;
    --c-bimo-2: #C2408A;
    --c-operacion: #A9BAD3;
    --c-operacion-2: #5D6B85;
    --c-pangea: #B7B3C9;
    --c-pangea-2: #726E85;
  }

  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Inter', sans-serif;
    color:var(--ink);
    overflow-x:hidden;
    min-height:100vh;
    position:relative;
  }
  h1,h2,h3,.display{ font-family:'Manrope', sans-serif; }

  /* ---------- SKY ---------- */
  #sky{
    position:fixed; inset:0; z-index:-2;
    background: linear-gradient(180deg,#3f8ee0 0%,#6bb6ec 55%,#bfe4f5 100%);
    transition: background 3s ease;
    overflow:hidden;
  }
  #sky .celestial{
    position:absolute; border-radius:50%;
    transition: opacity 2s ease, top 3s ease, left 3s ease;
  }
  #sky .sun{
    width:130px; height:130px;
    background: radial-gradient(circle, #FFF3C4 0%, #FFCF7F 55%, rgba(255,207,127,0) 76%);
    box-shadow: 0 0 110px 40px rgba(255,207,127,0.45);
  }
  #sky .moon{
    width:76px; height:76px;
    background: radial-gradient(circle at 35% 35%, #FDFBF0 0%, #E3E0D2 60%, rgba(227,224,210,0) 78%);
    box-shadow: 0 0 60px 18px rgba(253,251,240,0.22);
  }
  #sky .star{
    position:absolute; width:2px; height:2px; background:#fff; border-radius:50%;
    animation: twinkle 3.6s ease-in-out infinite;
  }
  @keyframes twinkle{ 0%,100%{opacity:.15} 50%{opacity:.95} }
  #sky .cloud{
    position:absolute; opacity:0.65; filter:blur(1px);
    background: rgba(255,255,255,0.75); border-radius:50%;
  }
  #sky-veil{
    position:fixed; inset:0; z-index:-1;
    background: linear-gradient(180deg, rgba(6,6,14,0.05) 0%, rgba(6,6,14,0.22) 100%);
    transition: background 3s ease;
  }

  /* ---------- LAYOUT ---------- */
  #app{
    position:relative; z-index:1;
    max-width:1480px; margin:0 auto;
    padding: 20px 28px 24px;
  }

  /* ---------- HEADER ---------- */
  header.hero{
    max-width:720px; margin:0 auto 14px;
    text-align:center;
  }
  .hero-badge{
    font-size:11px; color:var(--ink-faint); margin-bottom:6px;
    text-shadow: 0 2px 12px var(--shadow-ink);
  }
  .hero-message{
    font-size:13.5px; line-height:1.4; font-weight:500; color:var(--ink-dim);
    margin-bottom:6px;
    text-shadow: 0 2px 16px var(--shadow-ink);
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
  .hero-question{
    font-family:'Manrope', sans-serif;
    font-size:clamp(19px, 2.5vw, 29px); font-weight:800;
    letter-spacing:-0.02em; line-height:1.15;
    color:#fff;
    text-shadow: 0 4px 28px var(--shadow-ink);
  }
  @media (min-width: 760px){
    .hero-question{ white-space:nowrap; }
  }

  /* ---------- ALERT STRIP ---------- */
  #alert-strip{
    display:flex; flex-direction:column; gap:7px;
    max-width:900px; margin: 0 auto 12px;
  }
  .alert-row{
    display:flex; align-items:center; gap:10px;
    background: rgba(230,90,60,0.20);
    border:1px solid rgba(255,150,110,0.4);
    border-radius:11px;
    padding:8px 14px;
    font-size:12px;
    color:#FFE8DE;
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
  }
  .alert-row b{ color:#FFF6F0; }
  .alert-dot{ width:7px; height:7px; border-radius:50%; background:#FF7A5C; flex:none; box-shadow:0 0 10px 2px rgba(255,122,92,0.7); }

  /* ---------- BARRA DE TIEMPO ---------- */
  #timebar-card{
    max-width:1100px; margin: 0 auto 14px;
    background: rgba(16,16,26,0.34);
    border:1px solid var(--border-soft);
    border-radius:14px;
    padding:12px 18px 13px;
    backdrop-filter: blur(24px) saturate(140%);
    -webkit-backdrop-filter: blur(24px) saturate(140%);
  }
  .timebar-head{
    display:flex; justify-content:space-between; align-items:center;
    gap:14px; margin-bottom:8px; flex-wrap:wrap;
  }
  .timebar-title{ font-size:12.5px; font-weight:700; color:var(--ink); }
  .timebar-subtitle{ font-size:11px; color:var(--ink-faint); margin-top:1px; }
  .timebar-toggle{
    display:flex; gap:3px; background:rgba(255,255,255,0.06);
    border:1px solid var(--border-soft); border-radius:9px; padding:2px;
  }
  .timebar-toggle button{
    font-family:'Inter',sans-serif; font-size:11.5px; font-weight:600;
    padding:5px 11px; border-radius:7px; border:none; cursor:pointer;
    background:transparent; color:var(--ink-faint);
    transition: background .2s ease, color .2s ease;
  }
  .timebar-toggle button.active{
    background: rgba(255,255,255,0.14); color:#fff;
  }
  .timebar-track{
    position:relative;
    display:flex; align-items:stretch;
    width:100%; height:14px;
    border-radius:8px; overflow:hidden;
    background: rgba(255,255,255,0.07);
    border:1px solid var(--border-soft);
  }
  .timebar-seg{
    height:100%;
    background: linear-gradient(90deg, var(--seg-color) 0%, var(--seg-color2) 100%);
    position:relative;
    transition: filter .18s ease;
    min-width:2px;
  }
  .timebar-seg:hover{ filter:brightness(1.18); }
  .timebar-seg.late::after{
    content:""; position:absolute; inset:0;
    background: repeating-linear-gradient(45deg, rgba(255,255,255,0.22) 0 4px, transparent 4px 8px);
  }
  .timebar-gap{
    height:100%; flex:1 1 auto;
    background: repeating-linear-gradient(135deg, rgba(255,255,255,0.05) 0 6px, rgba(255,255,255,0.02) 6px 12px);
  }
  .timebar-caption{
    margin-top:6px; font-size:10.5px; color:var(--ink-faint);
  }
  .timebar-tooltip{
    position:absolute; bottom:calc(100% + 10px); left:50%;
    transform: translateX(-50%);
    background: rgba(10,10,18,0.94); border:1px solid var(--border);
    border-radius:10px; padding:8px 12px;
    font-size:12.5px; white-space:nowrap; color:#fff;
    pointer-events:none; opacity:0; transition:opacity .15s ease;
    z-index:5;
  }
  .timebar-tooltip.show{ opacity:1; }
  .timebar-tooltip b{ font-weight:700; }

  .timebar-legend{
    display:flex; flex-wrap:wrap; gap:4px 12px;
    margin-top:8px;
  }
  .legend-item{
    display:flex; align-items:center; gap:6px;
    font-size:11px; color:var(--ink-dim);
  }
  .legend-item.faded{ color:var(--ink-faint); }
  .legend-dot{
    width:8px; height:8px; border-radius:50%; flex:none;
    background: linear-gradient(135deg, var(--dot-color) 0%, var(--dot-color2) 100%);
  }
  .legend-dot.gap-dot{
    background: repeating-linear-gradient(135deg, rgba(255,255,255,0.35) 0 3px, rgba(255,255,255,0.1) 3px 6px);
  }
  .legend-dot.warn{ box-shadow: 0 0 0 3px rgba(255,122,92,0.35); }
  .legend-warn-flag{ font-size:10px; color:#FFB39B; margin-left:2px; }

  /* ---------- panel: registrar tiempo ---------- */
  .time-controls{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-top:4px; }
  .time-chip-btn{
    font-family:'Inter',sans-serif; font-size:12.5px; font-weight:600;
    padding:8px 13px; border-radius:10px; border:1px solid var(--border);
    background: rgba(255,255,255,0.05); color:var(--ink); cursor:pointer;
  }
  .time-chip-btn:hover{ background: rgba(255,255,255,0.12); }
  .time-today-readout{
    font-size:13px; color:var(--ink-dim); margin-top:10px;
  }
  .time-today-readout b{ color:var(--ink); }
  .time-reset-link{
    font-size:12px; color:var(--ink-faint); text-decoration:underline; cursor:pointer;
    margin-left:8px; background:none; border:none; font-family:'Inter',sans-serif;
  }
  .time-reset-link:hover{ color:var(--ink-dim); }

  /* ---------- indicador discreto "Trabajando en" (Home) ---------- */
  #working-indicator{
    display:none; align-items:center; justify-content:center; gap:8px;
    max-width:900px; margin:0 auto 10px;
    font-size:12px; color:var(--ink-dim);
    cursor:pointer;
  }
  #working-indicator.show{ display:flex; }
  #working-indicator .wi-dot{
    width:7px; height:7px; border-radius:50%; flex:none;
    animation: wi-pulse 1.8s infinite;
  }
  #working-indicator .wi-clock{ font-variant-numeric:tabular-nums; font-weight:700; color:var(--ink); }
  @keyframes wi-pulse{ 0%{box-shadow:0 0 0 0 rgba(92,242,158,.55);} 70%{box-shadow:0 0 0 7px rgba(92,242,158,0);} 100%{box-shadow:0 0 0 0 rgba(92,242,158,0);} }

  /* ---------- panel: cronómetro automático ---------- */
  .timer-cta{
    width:100%; display:flex; align-items:center; justify-content:center; gap:8px;
    font-family:'Manrope',sans-serif; font-weight:800; font-size:15px;
    padding:13px 16px; border-radius:14px; border:none; cursor:pointer;
    background: linear-gradient(150deg, var(--panel-accent) 0%, var(--panel-accent2) 100%);
    color:#0c0b16;
    box-shadow: 0 10px 24px -8px var(--panel-accent-soft);
    transition: transform .18s ease, filter .18s ease;
  }
  .timer-cta:hover{ transform: translateY(-2px); filter:brightness(1.06); }
  .timer-cta:active{ transform: translateY(0); }

  .timer-live-row{ display:flex; align-items:center; gap:10px; margin-bottom:12px; }
  .timer-pulse{ width:9px; height:9px; border-radius:50%; background:#5CF29E; flex:none; animation: wi-pulse 1.8s infinite; }
  .timer-live-row.paused .timer-pulse{ background:#FFC24B; animation:none; }
  .timer-live-clock{ font-size:22px; font-weight:800; font-variant-numeric:tabular-nums; color:var(--ink); }
  .timer-live-label{ font-size:12px; color:var(--ink-faint); }

  .manual-adjust-toggle{
    margin-top:12px; font-size:11.5px; color:var(--ink-faint);
    background:none; border:none; text-decoration:underline; cursor:pointer;
    font-family:'Inter',sans-serif; padding:0;
  }
  .manual-adjust-toggle:hover{ color:var(--ink-dim); }
  .manual-adjust-box{ margin-top:10px; padding-top:10px; border-top:1px solid var(--border-soft); display:none; }
  .manual-adjust-box.open{ display:block; }

  /* ---------- SECTION LABELS ---------- */
  .section-label{
    font-size:11px; color:var(--ink-faint);
    margin: 2px 2px 7px;
    text-shadow: 0 2px 10px var(--shadow-ink);
  }

  /* ---------- GRID ---------- */
  #grid-active{
    display:grid;
    grid-template-columns: repeat(4, minmax(0,1fr));
    gap:12px;
    margin-bottom:14px;
  }
  @media (max-width: 1099px){
    #grid-active{ grid-template-columns: repeat(3, minmax(0,1fr)); }
  }
  @media (max-width: 780px){
    #grid-active{ grid-template-columns: repeat(2, minmax(0,1fr)); }
  }
  @media (max-width: 520px){
    #grid-active{ grid-template-columns: 1fr; }
  }

  .card{
    position:relative;
    border-radius:16px;
    padding:13px 14px 12px;
    min-height:118px;
    display:flex; flex-direction:column;
    background:
      linear-gradient(150deg, var(--tint1) 0%, var(--tint2) 65%, rgba(14,13,22,0.30) 100%),
      rgba(16,15,24,0.38);
    border:1px solid var(--edge-soft);
    backdrop-filter: blur(26px) saturate(140%);
    -webkit-backdrop-filter: blur(26px) saturate(140%);
    cursor:pointer;
    transition: transform .32s cubic-bezier(.2,.8,.3,1), box-shadow .32s ease, border-color .32s ease, filter .32s ease;
    overflow:hidden;
    box-shadow: 0 8px 22px -16px rgba(0,0,0,0.5);
  }
  .card:hover{
    transform: translateY(-5px) scale(1.012);
    border-color: var(--edge);
    box-shadow: 0 20px 40px -18px rgba(0,0,0,0.55), 0 0 0 1px var(--edge), 0 0 28px 2px var(--tint1);
    filter: brightness(1.06);
  }

  .card-icon{
    width:28px; height:28px; border-radius:9px;
    display:flex; align-items:center; justify-content:center;
    background: linear-gradient(150deg, var(--edge) 0%, var(--edge2) 100%);
    box-shadow: 0 5px 12px -4px var(--tint1);
    flex:none;
  }
  .card-icon svg{ width:15px; height:15px; stroke:#fff; }

  .card-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
  .card-priority{
    font-size:9px; padding:3px 8px; border-radius:20px;
    background: rgba(255,255,255,0.14); color:#fff;
    white-space:nowrap; flex:none; margin-top:1px;
    backdrop-filter: blur(6px);
  }
  .card-name{ font-size:13.5px; font-weight:700; line-height:1.22; margin-top:8px; letter-spacing:-0.005em; }
  .card-stage{
    margin-top:4px; font-size:10.5px; color: var(--edge);
    font-weight:700; display:flex; align-items:center; gap:6px;
  }
  .card-stage .stage-dot{ width:5px; height:5px; border-radius:50%; background:var(--edge); box-shadow:0 0 6px 1px var(--edge); }
  .card-next{
    margin-top:auto; padding-top:7px; font-size:11px; line-height:1.4; color:var(--ink-dim);
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
  .card-alert{
    margin-top:6px; font-size:10px; color:#FFC4AE;
    display:flex; align-items:center; gap:5px;
  }
  .card-alert .stage-dot{ background:#FF7A5C; width:5px;height:5px;border-radius:50%; box-shadow:0 0 6px 1px #FF7A5C; }

  /* ---------- EN ESPERA ---------- */
  .waiting-strip{ margin-top:2px; padding-top:12px; border-top:1px solid rgba(255,255,255,0.10); }
  #grid-waiting{
    display:grid;
    grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
    gap:8px;
  }
  .card.waiting{
    min-height:auto; padding:10px 13px;
    filter: grayscale(0.35) brightness(0.82);
    opacity:0.66;
    box-shadow:none;
  }
  .card.waiting:hover{
    transform: translateY(-2px);
    filter: grayscale(0.2) brightness(0.92);
    opacity:0.82;
    box-shadow: 0 12px 26px -16px rgba(0,0,0,0.5);
  }
  .card.waiting .card-icon{ width:22px; height:22px; }
  .card.waiting .card-icon svg{ width:13px; height:13px; }
  .card.waiting .card-name{ font-size:12px; margin-top:6px; }
  .card.waiting .card-stage{ font-size:10px; }
  .card.waiting .card-next{ font-size:10.5px; -webkit-line-clamp:2; }

  /* ---------- GESTIONES ---------- */
  #gestiones{
    margin-top:10px;
    display:flex; flex-wrap:wrap; gap:7px;
    align-items:center;
  }
  #gestiones .g-label{ font-size:11px; color:var(--ink-faint); margin-right:5px; text-shadow: 0 2px 10px var(--shadow-ink);}
  .g-chip{
    font-size:10.5px; padding:5px 10px; border-radius:10px;
    background: rgba(255,255,255,0.10); border:1px solid var(--border-soft);
    color:var(--ink-dim); backdrop-filter: blur(10px);
  }

  /* ---------- SIDE PANEL ---------- */
  #scrim{
    position:fixed; inset:0; background:rgba(6,5,12,0.42);
    backdrop-filter: blur(2px);
    opacity:0; pointer-events:none;
    transition: opacity .35s ease;
    z-index:10;
  }
  #scrim.open{ opacity:1; pointer-events:auto; }

  #panel{
    position:fixed; top:0; right:0; height:100%;
    width:min(460px, 92vw);
    background: var(--panel-solid);
    border-left:1px solid var(--border);
    backdrop-filter: blur(30px);
    -webkit-backdrop-filter: blur(30px);
    transform: translateX(100%);
    transition: transform .4s cubic-bezier(.2,.8,.25,1);
    z-index:11;
    overflow-y:auto;
    padding: 30px 28px 40px;
  }
  #panel.open{ transform: translateX(0); }
  #panel-close{
    position:absolute; top:22px; right:24px;
    background:none; border:none; color:var(--ink-dim);
    font-size:22px; cursor:pointer; line-height:1;
    width:34px; height:34px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
  }
  #panel-close:hover{ background:rgba(255,255,255,0.08); color:var(--ink); }

  .panel-icon{
    width:48px; height:48px; border-radius:14px;
    display:flex; align-items:center; justify-content:center;
    background: linear-gradient(150deg, var(--panel-accent) 0%, var(--panel-accent2) 100%);
    margin-bottom:16px;
  }
  .panel-icon svg{ width:25px; height:25px; stroke:#fff; }

  .panel-eyebrow{ font-size:12.5px; color:var(--panel-accent); font-weight:700; margin-bottom:8px; }
  .panel-title{ font-size:25px; font-weight:800; line-height:1.2; margin-bottom:12px; padding-right:30px; }
  .panel-meta{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:22px; }
  .panel-meta span{
    font-size:11.5px; padding:5px 10px; border-radius:20px;
    background:rgba(255,255,255,0.08); color:var(--ink-dim);
  }

  .panel-block{ margin-bottom:24px; }
  .panel-block h3{
    font-size:12.5px; color:var(--ink-faint);
    font-weight:600; margin-bottom:8px; letter-spacing:0.01em;
  }
  .panel-block p{ font-size:14.5px; line-height:1.55; color:var(--ink-dim); }

  .next-action-box{
    background: var(--panel-accent-soft);
    border:1px solid var(--panel-accent);
    border-radius:16px;
    padding:16px 18px;
    font-size:15.5px; line-height:1.5; font-weight:600; color:var(--ink);
  }

  .stage-track{ display:flex; flex-direction:column; gap:0; margin-top:4px; }
  .stage-item{
    display:flex; align-items:flex-start; gap:12px;
    position:relative; padding-bottom:16px;
  }
  .stage-item:last-child{ padding-bottom:0; }
  .stage-item::before{
    content:""; position:absolute; left:5px; top:16px; bottom:-2px; width:1px;
    background: var(--border);
  }
  .stage-item:last-child::before{ display:none; }
  .stage-marker{
    width:11px; height:11px; border-radius:50%; flex:none; margin-top:3px;
    background: rgba(255,255,255,0.15); border:1px solid var(--border);
    z-index:1;
  }
  .stage-item.done .stage-marker{ background: var(--panel-accent); border-color:var(--panel-accent); }
  .stage-item.current .stage-marker{
    background: var(--panel-accent); border-color:var(--panel-accent);
    box-shadow: 0 0 0 4px var(--panel-accent-soft);
  }
  .stage-item span{ font-size:14px; color:var(--ink-faint); padding-top:1px; }
  .stage-item.done span{ color:var(--ink-dim); }
  .stage-item.current span{ color:var(--ink); font-weight:700; }

  .btn{
    font-family:'Inter',sans-serif;
    font-size:13.5px; font-weight:600;
    padding:10px 16px; border-radius:11px;
    border:1px solid var(--border);
    background: rgba(255,255,255,0.06);
    color:var(--ink); cursor:pointer;
    transition: background .2s ease, border-color .2s ease;
  }
  .btn:hover{ background: rgba(255,255,255,0.12); }
  .btn.primary{
    background: var(--panel-accent); border-color:var(--panel-accent); color:#0c0b16;
  }
  .btn.primary:hover{ filter:brightness(1.08); }

  textarea{
    width:100%; min-height:74px; resize:vertical;
    background: rgba(255,255,255,0.05); border:1px solid var(--border);
    border-radius:12px; color:var(--ink); font-family:'Inter',sans-serif;
    font-size:14px; padding:11px 13px; line-height:1.45;
  }
  textarea::placeholder{ color:var(--ink-faint); }
  textarea:focus{ outline:none; border-color:var(--panel-accent); }

  .log-entry{
    padding:10px 0; border-bottom:1px solid var(--border-soft);
    font-size:13.5px; color:var(--ink-dim); line-height:1.5;
  }
  .log-entry:last-child{ border-bottom:none; }
  .log-date{ font-size:11.5px; color:var(--ink-faint); display:block; margin-bottom:3px; }

  .dep-box{
    display:flex; gap:9px; align-items:flex-start;
    background: rgba(255,180,120,0.10);
    border:1px solid rgba(255,180,120,0.28);
    border-radius:12px; padding:12px 14px;
    font-size:13.5px; color:#F3D9BC; line-height:1.5;
  }

  .resource-item{

const STORAGE_KEY = "centro-control:estado-proyectos";
let state = {}; // { [id]: { stage, lastActivity, log:[{date,note}] } }

function todayISO(){ return new Date().toISOString().slice(0,10); }

function daysSince(iso){
  if(!iso) return null;
  const then = new Date(iso + "T00:00:00");
  const now = new Date();
  now.setHours(0,0,0,0);
  return Math.round((now - then) / 86400000);
}

async function loadState(){
  try{
    const res = await window.storage.get(STORAGE_KEY);
    if(res && res.value){
      state = JSON.parse(res.value);
    }
  }catch(e){
    state = {};
  }
  PROJECTS.forEach(p=>{
    if(!state[p.id]){
      state[p.id] = {
        stage: p.defaultStage ?? 0,
        lastActivity: todayISO(),
        log: []
      };
    }
  });
}

async function saveState(){
  try{
    await window.storage.set(STORAGE_KEY, JSON.stringify(state));
  }catch(e){
    console.error("No se pudo guardar el estado:", e);
  }
}

/* =========================================================
   TIEMPO TRABAJADO (registro real de horas por proyecto)
   ========================================================= */
const TIME_KEY = "centro-control:tiempo";
let timeLog = {}; // { "YYYY-MM-DD": { [projectId]: horas } }
let currentRange = "today"; // today | week | month

async function loadTimeLog(){
  try{
    const res = await window.storage.get(TIME_KEY);
    if(res && res.value) timeLog = JSON.parse(res.value);
  }catch(e){
    timeLog = {};
  }
}

async function saveTimeLog(){
  try{
    await window.storage.set(TIME_KEY, JSON.stringify(timeLog));
  }catch(e){
    console.error("No se pudo guardar el tiempo:", e);
  }
}

function addTimeToday(projectId, hours){
  const day = todayISO();
  if(!timeLog[day]) timeLog[day] = {};
  const current = timeLog[day][projectId] || 0;
  timeLog[day][projectId] = Math.max(0, current + hours);
  saveTimeLog();
}

function resetTimeToday(projectId){
  const day = todayISO();
  if(timeLog[day]) delete timeLog[day][projectId];
  saveTimeLog();
}

function hoursLoggedToday(projectId){
  const day = todayISO();
  return (timeLog[day] && timeLog[day][projectId]) || 0;
}

// Fechas (ISO) que componen cada rango, y su capacidad de referencia (8h/día)
function rangeDates(range){
  const today = new Date();
  today.setHours(0,0,0,0);
  const dates = [];

  if(range === "today"){
    dates.push(todayISO());
  } else if(range === "week"){
    const dow = today.getDay(); // 0=domingo..6=sábado
    const fromMonday = (dow + 6) % 7; // días desde el lunes
    for(let i=0; i<=fromMonday; i++){
      const d = new Date(today);
      d.setDate(d.getDate() - (fromMonday - i));
      dates.push(d.toISOString().slice(0,10));
    }
  } else if(range === "month"){
    const dayOfMonth = today.getDate();
    for(let i=1; i<=dayOfMonth; i++){
      const d = new Date(today.getFullYear(), today.getMonth(), i);
      dates.push(d.toISOString().slice(0,10));
    }
  }
  return dates;
}

function aggregateTime(range){
  const dates = rangeDates(range);
  const totals = {};
  let sum = 0;
  dates.forEach(day=>{
    const entry = timeLog[day];
    if(!entry) return;
    Object.keys(entry).forEach(pid=>{
      totals[pid] = (totals[pid] || 0) + entry[pid];
      sum += entry[pid];
    });
  });
  const capacity = dates.length * 8;
  return { totals, sum, capacity, days: dates.length };
}

function fmtHours(h){
  if(h === 0) return "0 h";
  if(Number.isInteger(h)) return h + " h";
  return (Math.round(h*4)/4).toString().replace(/\.0$/,'') + " h";
}

function isProjectLate(p){
  if(p.waiting || p.cyclic) return false;
  const d = daysSince(state[p.id].lastActivity);
  return d !== null && d >= p.warnAfterDays;
}

function renderTimeBar(){
  const { totals, sum, capacity, days } = aggregateTime(currentRange);
  const track = document.getElementById('timebar-track');
  const legend = document.getElementById('timebar-legend');
  const subtitle = document.getElementById('timebar-subtitle');
  const caption = document.getElementById('timebar-caption');

  const labelMap = { today: "hoy", week: "esta semana", month: "este mes" };
  subtitle.textContent = `Jornada de referencia: ${fmtHours(capacity)} (${labelMap[currentRange]})`;

  track.innerHTML = '';
  const overCapacity = sum > capacity;
  const denom = overCapacity ? sum : capacity;

  PROJECTS.filter(p=>!p.waiting).forEach(p=>{
    const h = totals[p.id] || 0;
    if(h <= 0) return;
    const pct = (h / denom) * 100;
    const seg = document.createElement('div');
    seg.className = 'timebar-seg' + (isProjectLate(p) ? ' late' : '');
    seg.style.setProperty('--seg-color', p.color);
    seg.style.setProperty('--seg-color2', p.color2);
    seg.style.width = pct + '%';

    const tip = document.createElement('div');
    tip.className = 'timebar-tooltip';
    const pctOfCapacity = Math.round((h / capacity) * 100);
    tip.innerHTML = `<b>${p.name}</b> · ${fmtHours(h)} · ${pctOfCapacity}% del tiempo`;
    seg.appendChild(tip);

    seg.addEventListener('mouseenter', ()=> tip.classList.add('show'));
    seg.addEventListener('mouseleave', ()=> tip.classList.remove('show'));

    track.appendChild(seg);
  });

  if(!overCapacity && sum < capacity){
    const gap = document.createElement('div');
    gap.className = 'timebar-gap';
    track.appendChild(gap);
  }

  caption.textContent = overCapacity
    ? `${fmtHours(sum)} registradas — por encima de la jornada de referencia de ${fmtHours(capacity)}.`
    : `${fmtHours(sum)} de ${fmtHours(capacity)} utilizadas.`;

  // Leyenda: proyectos con tiempo cargado + activos en 0 (para hacer visible el abandono) + espacio libre
  legend.innerHTML = '';
  PROJECTS.filter(p=>!p.waiting).forEach(p=>{
    const h = totals[p.id] || 0;
    const late = isProjectLate(p);
    if(h <= 0 && !late) return; // proyectos sin tiempo y sin alerta no ensucian la leyenda
    const item = document.createElement('div');
    item.className = 'legend-item' + (h<=0 ? ' faded' : '');
    item.innerHTML = `<span class="legend-dot${late?' warn':''}" style="--dot-color:${p.color}; --dot-color2:${p.color2};"></span>
      ${p.name} · ${fmtHours(h)}${late ? '<span class="legend-warn-flag">postergado</span>' : ''}`;
    legend.appendChild(item);
  });
  if(!overCapacity && sum < capacity){
    const free = document.createElement('div');
    free.className = 'legend-item faded';
    free.innerHTML = `<span class="legend-dot gap-dot"></span>Disponible · ${fmtHours(capacity - sum)}`;
    legend.appendChild(free);
  }
}

document.getElementById('timebar-toggle').addEventListener('click', (e)=>{
  const btn = e.target.closest('button[data-range]');
  if(!btn) return;
  currentRange = btn.dataset.range;
  document.querySelectorAll('#timebar-toggle button').forEach(b=> b.classList.toggle('active', b===btn));
  renderTimeBar();
});

/* =========================================================
   CRONÓMETRO AUTOMÁTICO POR PROYECTO
   ========================================================= */
const TIMER_KEY = "centro-control:timer";
let timerState = { projectId: null, running: false, segmentStartMs: null };

async function loadTimerState(){
  try{
    const res = await window.storage.get(TIMER_KEY);
    if(res && res.value) timerState = JSON.parse(res.value);
  }catch(e){
    timerState = { projectId: null, running: false, segmentStartMs: null };
  }
  if(timerState.running){
    // No contamos el tiempo con la pestaña cerrada: retomamos la sesión desde ahora.
    timerState.segmentStartMs = Date.now();
    saveTimerState();
  }
}

async function saveTimerState(){
  try{
    await window.storage.set(TIMER_KEY, JSON.stringify(timerState));
  }catch(e){
    console.error("No se pudo guardar el cronómetro:", e);
  }
}

function fmtClock(totalSeconds){
  totalSeconds = Math.max(0, Math.round(totalSeconds));
  const h = Math.floor(totalSeconds/3600);
  const m = Math.floor((totalSeconds%3600)/60);
  const s = totalSeconds%60;
  const pad = n => String(n).padStart(2,'0');
  return `${pad(h)}:${pad(m)}:${pad(s)}`;
}

function liveElapsedSecondsForProject(pid){
  let secs = hoursLoggedToday(pid) * 3600;
  if(timerState.projectId === pid && timerState.running && timerState.segmentStartMs){
    secs += (Date.now() - timerState.segmentStartMs) / 1000;
  }
  return secs;
}

// Vuelca el segmento en curso al registro de hoy (timeLog) sin cortar la sesión.
function flushTimer(){
  if(timerState.running && timerState.projectId && timerState.segmentStartMs){
    const elapsedHours = (Date.now() - timerState.segmentStartMs) / 3600000;
    if(elapsedHours > 0){
      addTimeToday(timerState.projectId, elapsedHours);
      if(state[timerState.projectId]){
        state[timerState.projectId].lastActivity = todayISO();
        saveState();
      }
    }
    timerState.segmentStartMs = Date.now();
    saveTimerState();
  }
}

function startTimer(projectId){
  // Si había otro proyecto corriendo, se cierra prolijamente antes de iniciar el nuevo.
  if(timerState.projectId && timerState.projectId !== projectId && timerState.running){
    flushTimer();
  }
  timerState = { projectId, running:true, segmentStartMs: Date.now() };
  saveTimerState();
  if(state[projectId]){
    state[projectId].lastActivity = todayISO();
    saveState();
  }
  refreshAfterTimerChange();
}

function pauseTimer(){
  if(!timerState.running) return;
  flushTimer();
  timerState.running = false;
  timerState.segmentStartMs = null;
  saveTimerState();
  refreshAfterTimerChange();
}

function resumeTimer(){
  if(timerState.running || !timerState.projectId) return;
  timerState.running = true;
  timerState.segmentStartMs = Date.now();
  saveTimerState();
  if(state[timerState.projectId]){
    state[timerState.projectId].lastActivity = todayISO();
    saveState();
  }
  refreshAfterTimerChange();
}

function finishSession(){
  if(timerState.running) flushTimer();
  timerState = { projectId:null, running:false, segmentStartMs:null };
  saveTimerState();
  refreshAfterTimerChange();
}

function refreshAfterTimerChange(){
  renderGrids();
  renderAlerts();
  renderTimeBar();
  renderWorkingIndicator();
  if(panel.classList.contains('open') && currentProjectId){
    const proj = PROJECTS.find(x=>x.id===currentProjectId);
    if(proj) renderPanelContent(proj);
  }
}

function renderWorkingIndicator(){
  const el = document.getElementById('working-indicator');
  if(!el) return;
  if(!timerState.projectId){
    el.classList.remove('show');
    return;
  }
  const p = PROJECTS.find(x=>x.id===timerState.projectId);
  if(!p){ el.classList.remove('show'); return; }
  el.classList.add('show');
  const secs = liveElapsedSecondsForProject(p.id);
  el.innerHTML = `<span class="wi-dot" style="background:${timerState.running?'#5CF29E':'#FFC24B'}"></span>
    Trabajando en: <b style="color:${p.color}">${p.name}</b> · <span class="wi-clock" id="working-indicator-clock">${fmtClock(secs)}</span>
    ${!timerState.running ? '<span style="color:var(--ink-faint);"> (en pausa)</span>' : ''}`;
  el.onclick = ()=> openPanel(p);
}

// Ticks de UI cada segundo (no persisten nada, solo actualizan el texto visible)
setInterval(()=>{
  if(!timerState.projectId) return;
  const secs = liveElapsedSecondsForProject(timerState.projectId);
  const wc = document.getElementById('working-indicator-clock');
  if(wc) wc.textContent = fmtClock(secs);
  const pc = document.getElementById('live-clock-readout');
  if(pc && panel.classList.contains('open') && currentProjectId === timerState.projectId){
    pc.textContent = fmtClock(secs);
  }
}, 1000);

// Volcado periódico a almacenamiento para no perder progreso si se cierra la pestaña
setInterval(()=>{
  if(timerState.running){
    flushTimer();
    renderGrids();
    renderAlerts();
    renderTimeBar();
  }
}, 20000);

window.addEventListener('beforeunload', ()=>{ if(timerState.running) flushTimer(); });
document.addEventListener('visibilitychange', ()=>{ if(document.hidden && timerState.running) flushTimer(); });

function timerBlockHtml(p){
  const isActiveHere = timerState.projectId === p.id;
  const running = isActiveHere && timerState.running;
  const paused = isActiveHere && !timerState.running;
  const secs = liveElapsedSecondsForProject(p.id);

  let mainControls;
  if(running){
    mainControls = `
      <div class="timer-live-row">

        <span class="timer-pulse"></span>

        <span class="timer-live-label">en pausa</span>
      </div>
      <div class="time-controls">
        <button class="timer-cta" id="btn-resume-timer" style="padding:10px 16px; font-size:13.5px;">▶ Continuar</button>
        <button class="btn" id="btn-finish-timer">■ Finalizar sesión</button>
      </div>`;
  } else {
    mainControls = `<button class="timer-cta" id="btn-start-timer">▶ Empezar a trabajar</button>`;
  }

  return `
    <div class="panel-block">
      <h3>Tiempo trabajado</h3>

        <div class="time-controls">
          <button class="time-chip-btn" data-manual="0.25">+15 min</button>
          <button class="time-chip-btn" data-manual="0.5">+30 min</button>
          <button class="time-chip-btn" data-manual="1">+1 h</button>
          <button class="time-chip-btn" data-manual="2">+2 h</button>
        </div>
        <div class="time-today-readout">Hoy llevás <b>${fmtHours(liveElapsedSecondsForProject(p.id)/3600)}</b> en este proyecto.
          ${hoursLoggedToday(p.id) > 0 ? `<button class="time-reset-link" id="btn-reset-time">Restablecer a 0</button>` : ''}
        </div>
      </div>

  `;

function pickDailyMessage(){

  const dayNum = Math.floor(d.getTime() / 86400000);
  const idx = dayNum % MOTIVATIONAL_MESSAGES.length;
  return MOTIVATIONAL_MESSAGES[idx];
}

    dateStr.charAt(0).toUpperCase() + dateStr.slice(1);

/* =========================================================
   RENDER: TARJETAS
   ========================================================= */
function stageLabel(p){
  if(p.cyclic){
    const isSunday = new Date().getDay() === 0;
    return isSunday ? "Hoy: preparación semanal" : "Gestión entre bloques";
  }
  if(!p.stages) return "";
  const st = state[p.id];
  return p.stages[st.stage];
}

function nextActionLabel(p){
  if(p.cyclic){
    const isSunday = new Date().getDay() === 0;
    return isSunday
      ? "Preparar tiras, cargar zonas y hacer las cuentas de la semana."
      : "Resolver lo operativo puntual que aparezca, sin bloques fijos.";
  }
  // Si un pendiente fue convertido en próxima acción, tiene prioridad sobre la acción original.
  if(state[p.id] && state[p.id].nextActionOverride){
    return state[p.id].nextActionOverride;
  }
  return p.nextAction;
}

// Solo para la vista compacta de Home: resume el texto sin alterar el dato real
function shortText(str, max){
  if(!str) return "";
  if(str.length <= max) return str;
  return str.slice(0, max - 1).trim() + "…";
}

function buildCard(p){
  const card = document.createElement('div');
  card.className = 'card' + (p.waiting ? ' waiting' : '');
  card.style.setProperty('--tint1', `color-mix(in srgb, ${p.color} 26%, transparent)`);
  card.style.setProperty('--tint2', `color-mix(in srgb, ${p.color2} 16%, transparent)`);
  card.style.setProperty('--edge', p.color);
  card.style.setProperty('--edge2', p.color2);
  card.style.setProperty('--edge-soft', `color-mix(in srgb, ${p.color} 32%, transparent)`);

  const isLate = !p.waiting && !p.cyclic && daysSince(state[p.id].lastActivity) !== null
    && daysSince(state[p.id].lastActivity) >= p.warnAfterDays;

  card.innerHTML = `
    <div class="card-top">
      <div class="card-icon">${ICONS[p.icon]}</div>
      <div class="card-priority">${isLate ? 'Alerta de atraso' : p.priority}</div>
    </div>
    <div class="card-name">${p.name}</div>
    <div class="card-stage"><span class="stage-dot"></span>${stageLabel(p)}</div>
    <div class="card-next">${shortText(nextActionLabel(p), 92)}</div>
  `;
  card.addEventListener('click', ()=> openPanel(p));
  return card;
}

function renderGrids(){
  const gridActive = document.getElementById('grid-active');
  const gridWaiting = document.getElementById('grid-waiting');
  gridActive.innerHTML = '';
  gridWaiting.innerHTML = '';

  PROJECTS.forEach(p=>{
    const card = buildCard(p);
    if(p.waiting) gridWaiting.appendChild(card);
    else gridActive.appendChild(card);
  });

  const gestionesEl = document.getElementById('gestiones');
  gestionesEl.innerHTML = `<span class="g-label">Gestiones puntuales</span>` +
    GESTIONES.map(g=>`<span class="g-chip">${g.label}</span>`).join('');
}

/* =========================================================

   ========================================================= */
function renderAlerts(){
  const strip = document.getElementById('alert-strip');
  strip.innerHTML = '';
  PROJECTS.forEach(p=>{
    if(p.waiting || p.cyclic) return;
    const d = daysSince(state[p.id].lastActivity);
    if(d !== null && d >= p.warnAfterDays){
      const row = document.createElement('div');
      row.className = 'alert-row';
      row.innerHTML = `<span class="alert-dot"></span>
        <span>Ojo: hace <b>${d} días</b> que no trabajamos en <b>${p.name}</b>. Próxima acción: ${nextActionLabel(p)}</span>`;
      strip.appendChild(row);
    }
  });
}

const panel = document.getElementById('panel');
const scrim = document.getElementById('scrim');
let currentProjectId = null;

function openPanel(p){
  currentProjectId = p.id;
  panel.style.setProperty('--panel-accent', p.color);
  panel.style.setProperty('--panel-accent2', p.color2);
  panel.style.setProperty('--panel-accent-soft', `color-mix(in srgb, ${p.color} 22%, transparent)`);
  renderPanelContent(p);
  panel.classList.add('open');
  scrim.classList.add('open');
  panel.setAttribute('aria-hidden', 'false');
}

function closePanel(){
  panel.classList.remove('open');
  scrim.classList.remove('open');
  panel.setAttribute('aria-hidden', 'true');
}

document.getElementById('panel-close').addEventListener('click', closePanel);
scrim.addEventListener('click', closePanel);
document.addEventListener('keydown', e=>{ if(e.key === 'Escape') closePanel(); });

function renderPanelContent(p){
  const st = state[p.id];
  const container = document.getElementById('panel-content');
  const d = daysSince(st.lastActivity);

  let stagesHtml = '';
  if(p.stages){
    stagesHtml = `<div class="panel-block"><h3>Etapa del proyecto</h3><div class="stage-track">` +
      p.stages.map((s,i)=>{
        const cls = i < st.stage ? 'done' : (i === st.stage ? 'current' : '');
        return `<div class="stage-item ${cls}"><div class="stage-marker"></div><span>${s}</span></div>`;
      }).join('') +
      `</div>` +
      (!p.waiting ? `<div style="margin-top:14px; display:flex; gap:10px;">
        <button class="btn" id="btn-stage-back" ${st.stage===0?'disabled style="opacity:.4;cursor:default;"':''}>← Etapa anterior</button>
        <button class="btn primary" id="btn-stage-fwd" ${st.stage>=p.stages.length-1?'disabled style="opacity:.4;cursor:default;"':''}>Avanzar de etapa →</button>
      </div>` : '') +
      `</div>`;
  }

  const depHtml = p.dependency ? `
    <div class="panel-block">
      <h3>Dependencia</h3>
      <div class="dep-box">${p.dependency}</div>
    </div>` : '';

  const resourcesHtml = (p.resources && p.resources.length) ? `
    <div class="panel-block">
      <h3>Accesos para continuar</h3>
      ${p.resources.map(r=>`<div class="resource-item"><span class="resource-dot"></span>${r}</div>`).join('')}
    </div>` : '';

  const lastLog = st.log && st.log.length ? st.log[st.log.length-1] : null;

  const logHtml = (st.log && st.log.length) ? `
    <div class="panel-block">
      <h3>Historial de avances</h3>
      ${st.log.slice().reverse().slice(0,6).map(l=>`
        <div class="log-entry"><span class="log-date">${l.date}</span>${l.note}</div>
      `).join('')}
    </div>` : '';

  container.innerHTML = `
    <div class="panel-icon">${ICONS[p.icon]}</div>
    <div class="panel-eyebrow">${p.status} · ${p.priority}</div>
    <div class="panel-title">${p.name}</div>
    <div class="panel-meta">
      <span>Última actividad: ${st.lastActivity}${d!==null ? ` (hace ${d} día${d===1?'':'s'})` : ''}</span>
    </div>

    <div class="panel-block">
      <h3>Dónde quedamos</h3>
      <p>${lastLog ? lastLog.note : (p.where || 'Todavía no hay un registro de avance guardado.')}</p>
    </div>

    <div class="panel-block">
      <h3>Próxima acción concreta</h3>
      <div class="next-action-box">${nextActionLabel(p)}</div>
    </div>

    ${!p.waiting ? timerBlockHtml(p) : ''}

    ${stagesHtml}
    ${depHtml}
    ${resourcesHtml}

    ${!p.waiting ? `
    <div class="panel-block">
      <h3>Registrar avance de hoy</h3>
      <textarea id="log-input" placeholder="¿Qué hiciste, dónde quedaste, qué sigue?"></textarea>
      <div style="margin-top:10px;">
        <button class="btn primary" id="btn-save-log">Registrar avance</button>
      </div>
    </div>` : ''}

    ${logHtml}

    ${documentosBlockHtml(p)}
  `;

  wireDocumentEvents(p);

  if(!p.waiting){
    const backBtn = document.getElementById('btn-stage-back');
    const fwdBtn = document.getElementById('btn-stage-fwd');
    if(backBtn) backBtn.addEventListener('click', ()=> changeStage(p, -1));
    if(fwdBtn) fwdBtn.addEventListener('click', ()=> changeStage(p, 1));

    const saveBtn = document.getElementById('btn-save-log');
    if(saveBtn) saveBtn.addEventListener('click', ()=> saveLog(p));

    container.querySelectorAll('[data-manual]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        addTimeToday(p.id, parseFloat(btn.dataset.manual));
        state[p.id].lastActivity = todayISO();
        saveState();
        renderPanelContent(p);
        renderGrids();
        renderAlerts();
        renderTimeBar();
      });
    });
    const resetBtn = document.getElementById('btn-reset-time');
    if(resetBtn) resetBtn.addEventListener('click', ()=>{
      resetTimeToday(p.id);
      renderPanelContent(p);
      renderGrids();
      renderAlerts();
      renderTimeBar();
    });

    const manualToggle = document.getElementById('manual-adjust-toggle');
    const manualBox = document.getElementById('manual-adjust-box');
    if(manualToggle && manualBox){
      manualToggle.addEventListener('click', ()=>{
        const isOpen = manualBox.classList.toggle('open');
        manualToggle.textContent = isOpen ? 'Ocultar ajuste manual' : 'Ajuste manual';
      });
    }

    const startBtn = document.getElementById('btn-start-timer');
    if(startBtn) startBtn.addEventListener('click', ()=> startTimer(p.id));

    const pauseBtn = document.getElementById('btn-pause-timer');
    if(pauseBtn) pauseBtn.addEventListener('click', ()=> pauseTimer());

    const resumeBtn = document.getElementById('btn-resume-timer');
    if(resumeBtn) resumeBtn.addEventListener('click', ()=> resumeTimer());

    const finishBtn = document.getElementById('btn-finish-timer');
    if(finishBtn) finishBtn.addEventListener('click', ()=> finishSession());
  }
}

function changeStage(p, delta){
  const st = state[p.id];
  const newStage = st.stage + delta;
  if(newStage < 0 || newStage > p.stages.length - 1) return;
  st.stage = newStage;
  st.lastActivity = todayISO();
  saveState();
  renderPanelContent(p);
  renderGrids();
  renderAlerts();
  renderTimeBar();
}

function saveLog(p){
  const input = document.getElementById('log-input');
  const note = input.value.trim();
  if(!note) return;
  const st = state[p.id];
  st.log = st.log || [];
  st.log.push({ date: todayISO(), note });
  st.lastActivity = todayISO();
  saveState();
  renderPanelContent(p);
  renderGrids();
  renderAlerts();
  renderTimeBar();
}

/* =========================================================
   CIELO DINÁMICO
   ========================================================= */
const sky = document.getElementById('sky');
const skyVeil = document.getElementById('sky-veil');

const SKY_GRADIENTS = {
  dawn:   'linear-gradient(180deg,#3b4d7a 0%,#a8577c 42%,#ff8f6b 78%,#ffd39c 100%)',
  day:    'linear-gradient(180deg,#2f7fd6 0%,#5aabe8 50%,#9fd6f2 82%,#e7f5fb 100%)',
  cloudy: 'linear-gradient(180deg,#5f7188 0%,#8fa0b2 55%,#c7d3da 100%)',
  dusk:   'linear-gradient(180deg,#241f4a 0%,#7a3f6b 45%,#e2683f 80%,#ffb27a 100%)',
  night:  'linear-gradient(180deg,#080b1c 0%,#131a3d 50%,#232a56 100%)',
  rain:   'linear-gradient(180deg,#38445a 0%,#54627c 55%,#79879e 100%)'
};

const VEIL_OPACITY = {
  dawn: 0.10, day: 0.04, cloudy: 0.12, dusk: 0.16, night: 0.32, rain: 0.22
};

function applyFallbackSky(){
  const h = new Date().getHours();
  let key;
  if(h >= 5 && h < 8) key = 'dawn';
  else if(h >= 8 && h < 17) key = 'day';
  else if(h >= 17 && h < 19) key = 'dusk';
  else key = 'night';
  paintSky(key, h);
}

function paintSky(key, hour){
  sky.style.background = SKY_GRADIENTS[key];
  const v = VEIL_OPACITY[key] ?? 0.15;
  skyVeil.style.background = `linear-gradient(180deg, rgba(6,6,14,${v*0.5}) 0%, rgba(6,6,14,${v}) 100%)`;
  renderCelestials(key, hour);
}

function renderCelestials(key, hour){
  sky.innerHTML = '';
  const nightish = key === 'night';

  if(nightish){
    for(let i=0;i<60;i++){
      const s = document.createElement('div');
      s.className = 'star';
      s.style.left = Math.random()*100 + '%';
      s.style.top = Math.random()*70 + '%';
      s.style.animationDelay = (Math.random()*3) + 's';
      sky.appendChild(s);
    }
    const moon = document.createElement('div');
    moon.className = 'celestial moon';
    moon.style.top = '8%'; moon.style.left = '78%';
    sky.appendChild(moon);
  } else if(key !== 'rain' && key !== 'cloudy'){
    const sun = document.createElement('div');
    sun.className = 'celestial sun';
    const pos = key === 'dawn' ? {top:'58%',left:'12%'}
              : key === 'dusk' ? {top:'58%',left:'82%'}
              : {top:'8%',left:'70%'};
    sun.style.top = pos.top; sun.style.left = pos.left;
    sky.appendChild(sun);
  }

  if(key === 'cloudy' || key === 'rain'){
    for(let i=0;i<5;i++){
      const c = document.createElement('div');
      c.className = 'cloud';
      const size = 90 + Math.random()*110;
      c.style.width = size+'px'; c.style.height = (size*0.5)+'px';
      c.style.top = (8+Math.random()*36)+'%';
      c.style.left = (Math.random()*90)+'%';
      sky.appendChild(c);
    }
  }
}

function weatherCodeToKey(code, isDay, hour){
  const night = isDay === 0;
  if([61,63,65,80,81,82,95,96,99,51,53,55,66,67].includes(code)) return 'rain';
  if([1,2,3,45,48].includes(code)) return night ? 'night' : 'cloudy';
  if(night) return 'night';
  if(hour >= 5 && hour < 8) return 'dawn';
  if(hour >= 17 && hour < 19) return 'dusk';
  return 'day';
}

function tryRealSky(){
  if(!('geolocation' in navigator)){ return; }

  const timeout = new Promise((_, reject)=> setTimeout(()=>reject('timeout'), 6000));

  const geo = new Promise((resolve, reject)=>{
    navigator.geolocation.getCurrentPosition(
      pos => resolve(pos.coords),
      err => reject(err),
      { timeout: 5000, maximumAge: 1800000 }
    );
  });

  Promise.race([geo, timeout])
    .then(coords=>{
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${coords.latitude}&longitude=${coords.longitude}&current=weather_code,is_day&timezone=auto`;
      return Promise.race([fetch(url).then(r=>r.json()), timeout]);
    })
    .then(data=>{
      if(!data || !data.current) throw new Error('sin datos');
      const hour = new Date().getHours();
      const key = weatherCodeToKey(data.current.weather_code, data.current.is_day, hour);
      paintSky(key, hour);
    })
    .catch(()=>{
      // El fallback ya está aplicado; no hacemos nada más.
    });
}

const PENDIENTES_KEY = "centro-control:pendientes";
let pendientes = [];

const PROJECT_KEYWORDS = {
  comercial: ["app comercial","app de gestión comercial","arquitectura","módulo","modulo","auditoría de arquitectura","auditoria de arquitectura","reglas operativas","mapa maestro","hoja de ruta","presentismo","liquidación","liquidacion"],
  norden: ["norden"],
  bimo: ["bimo"],
  appsheet: ["appsheet","app sheet"],
  operacion: ["distribución","distribucion","reparto","tiras","cargar zonas","repartidor de hoy","zona de hoy"],
  pangea: ["pangea"]
};

function detectProjectId(text){
  const t = (text || "").toLowerCase();
  if(!t.trim()) return null;
  for(const p of PROJECTS){
    const kws = PROJECT_KEYWORDS[p.id] || [];
    if(kws.some(k => t.includes(k))) return p.id;
  }
  return null;
}

async function loadPendientes(){
  try{
    const res = await window.storage.get(PENDIENTES_KEY);
    if(res && res.value) pendientes = JSON.parse(res.value);
  }catch(e){
    pendientes = [];
  }
}

async function savePendientes(){
  try{
    await window.storage.set(PENDIENTES_KEY, JSON.stringify(pendientes));
  }catch(e){
    console.error("No se pudieron guardar los pendientes:", e);
  }
  updatePendientesBadge();
}

function updatePendientesBadge(){
  const badge = document.getElementById('pendientes-badge');
  if(!badge) return;
  const count = pendientes.filter(x => !x.projectId && x.status !== 'hecho').length;
  badge.textContent = count;
  badge.classList.toggle('zero', count === 0);
}

function fillProjectSelect(selectEl, selectedId){
  selectEl.innerHTML = `<option value="">Sin clasificar</option>` +
    PROJECTS.map(p => `<option value="${p.id}" ${p.id===selectedId?'selected':''}>${p.name}</option>`).join('');

function openCaptureModal(){

document.getElementById('fab-capture').addEventListener('click', openCaptureModal);

document.getElementById('capture-save').addEventListener('click', async ()=>{

  const item = {

const PRIORITY_LABEL = { alta:'Alta', media:'Media', baja:'Baja' };
const STATUS_LABEL = { pendiente:'Pendiente', en_progreso:'En progreso', hecho:'Hecho' };

function pendienteItemHtml(item){
  const chips = [];
  if(item.priority) chips.push(`<span class="pp-chip">Prioridad: ${PRIORITY_LABEL[item.priority]}</span>`);
  if(item.dueDate) chips.push(`<span class="pp-chip">Vence: ${item.dueDate}</span>`);
  chips.push(`<span class="pp-chip">${STATUS_LABEL[item.status] || 'Pendiente'}</span>`);

  return `
    <div class="pp-item" data-id="${item.id}">
      <div class="pp-item-text">${item.text}</div>
      ${item.notes ? `<div class="pp-item-text" style="font-size:12.5px;color:var(--ink-faint);">${item.notes}</div>` : ''}
      <div class="pp-item-meta">${chips.join('')}</div>
      <div class="pp-item-controls">
        <select data-action="project">
          <option value="">Sin clasificar</option>
          ${PROJECTS.map(p=>`<option value="${p.id}" ${item.projectId===p.id?'selected':''}>${p.name}</option>`).join('')}
        </select>
        <select data-action="status">
          ${Object.keys(STATUS_LABEL).map(k=>`<option value="${k}" ${item.status===k?'selected':''}>${STATUS_LABEL[k]}</option>`).join('')}
        </select>
        ${item.projectId ? `<button class="pp-btn primary" data-action="convert">Convertir en próxima acción</button>` : ''}
        <button class="pp-btn danger" data-action="delete">Eliminar</button>
      </div>
    </div>
  `;
}

function renderPendientesList(){
  const container = document.getElementById('pendientes-list');
  container.innerHTML = '';

  const activos = pendientes.filter(x => x.status !== 'hecho');
  const sinClasificar = activos.filter(x => !x.projectId);

  const groupBlock = (title, dotColor, items) => {
    if(items.length === 0) return '';
    return `
      <div class="pp-group">
        <div class="pp-group-title"><span class="pp-group-dot" style="background:${dotColor}"></span>${title} (${items.length})</div>
        ${items.map(pendienteItemHtml).join('')}
      </div>`;
  };

  let html = groupBlock('Sin clasificar', 'rgba(255,255,255,0.4)', sinClasificar);

  PROJECTS.forEach(p=>{
    const items = activos.filter(x => x.projectId === p.id);
    html += groupBlock(p.name, p.color.startsWith('var') ? getComputedStyle(document.documentElement).getPropertyValue(p.color.slice(4,-1)).trim() || '#999' : p.color, items);
  });

  const hechos = pendientes.filter(x => x.status === 'hecho');
  if(hechos.length){
    html += `<div class="pp-group"><div class="pp-group-title" style="opacity:.6;"><span class="pp-group-dot" style="background:#666"></span>Hechos (${hechos.length})</div>${hechos.map(pendienteItemHtml).join('')}</div>`;
  }

  container.innerHTML = html || `<div class="pp-empty">Todavía no capturaste ningún pendiente. Usá el botón + para anotar algo rápido.</div>`;

  container.querySelectorAll('.pp-item').forEach(el=>{
    const id = el.dataset.id;
    const item = pendientes.find(x => x.id === id);
    if(!item) return;

    el.querySelector('[data-action="project"]').addEventListener('change', async (e)=>{
      item.projectId = e.target.value || null;
      await savePendientes();
      renderPendientesList();
    });
    el.querySelector('[data-action="status"]').addEventListener('change', async (e)=>{
      item.status = e.target.value;
      await savePendientes();
      renderPendientesList();
    });
    const convertBtn = el.querySelector('[data-action="convert"]');
    if(convertBtn){
      convertBtn.addEventListener('click', async ()=>{
        const proj = PROJECTS.find(p=>p.id===item.projectId);
        if(!proj) return;
        if(!state[proj.id]) return;
        state[proj.id].nextActionOverride = item.text;
        state[proj.id].lastActivity = todayISO();
        await saveState();
        item.status = 'en_progreso';
        await savePendientes();
        renderGrids();
        renderAlerts();
        renderPendientesList();
      });
    }
    el.querySelector('[data-action="delete"]').addEventListener('click', async ()=>{
      pendientes = pendientes.filter(x => x.id !== id);
      await savePendientes();
      renderPendientesList();
    });
  });
}

const DOCS_KEY = "centro-control:documentos";
let documentos = {}; // { [projectId]: [ {id,type,name,url,category,description} ] }

const FOLDER_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6.5a1.5 1.5 0 0 1 1.5-1.5H9l2 2h8.5A1.5 1.5 0 0 1 21 8.5v9A1.5 1.5 0 0 1 19.5 19h-15A1.5 1.5 0 0 1 3 17.5v-11Z"></path></svg>`;
const DOC_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2.5h8l4 4v14.5a.5.5 0 0 1-.5.5h-11a.5.5 0 0 1-.5-.5v-18a.5.5 0 0 1 .5-.5Z"></path><path d="M14 2.5V7h4.5"></path></svg>`;

function docItemRowHtml(item, idx, total){
  const icon = item.type === 'carpeta' ? FOLDER_ICON : DOC_ICON;
  return `
    <div class="doc-item" data-id="${item.id}">
      <div class="doc-item-icon">${icon}</div>
      <div class="doc-item-main">
        <div class="doc-item-name" data-action="open" title="Abrir en Drive">${item.name}</div>
        ${item.category ? `<div class="doc-item-meta"><span class="doc-chip">${item.category}</span></div>` : ''}
        ${item.description ? `<div class="doc-item-desc">${item.description}</div>` : ''}
      </div>
      <div class="doc-item-actions">
        <button data-action="up" title="Subir" ${idx===0?'disabled':''}>↑</button>
        <button data-action="down" title="Bajar" ${idx===total-1?'disabled':''}>↓</button>
        <button data-action="edit" title="Editar">✎</button>
        <button data-action="delete" title="Eliminar">✕</button>
      </div>
    </div>`;
}

function documentosBlockHtml(p){
  const items = documentos[p.id] || [];
  const rows = items.map((item, idx) => docItemRowHtml(item, idx, items.length)).join('');
  return `
    <div class="panel-block">
      <h3>Documentos / Archivos</h3>
      <div class="doc-list" data-project="${p.id}">
        ${rows || `<div class="doc-empty">Todavía no hay accesos registrados. Los archivos reales quedan en Google Drive; acá solo guardás el enlace.</div>`}
      </div>
      <button class="btn" id="btn-add-doc">+ Agregar acceso</button>
    </div>`;
}

function wireDocumentEvents(p){
  const addBtn = document.getElementById('btn-add-doc');
  if(addBtn) addBtn.addEventListener('click', ()=> openDocModal(p.id, null));

  document.querySelectorAll(`.doc-list[data-project="${p.id}"] .doc-item`).forEach(el=>{
    const id = el.dataset.id;
    const openEl = el.querySelector('[data-action="open"]');
    if(openEl) openEl.addEventListener('click', ()=>{
      const item = (documentos[p.id]||[]).find(x=>x.id===id);
      if(item) window.open(item.url, '_blank', 'noopener');
    });
    const upBtn = el.querySelector('[data-action="up"]');
    if(upBtn) upBtn.addEventListener('click', ()=> moveDoc(p.id, id, -1));
    const downBtn = el.querySelector('[data-action="down"]');
    if(downBtn) downBtn.addEventListener('click', ()=> moveDoc(p.id, id, 1));
    const editBtn = el.querySelector('[data-action="edit"]');
    if(editBtn) editBtn.addEventListener('click', ()=> openDocModal(p.id, id));
    const delBtn = el.querySelector('[data-action="delete"]');
    if(delBtn) delBtn.addEventListener('click', ()=> deleteDoc(p.id, id));
  });
}

async function moveDoc(projectId, id, delta){
  const list = documentos[projectId] || [];
  const idx = list.findIndex(x=>x.id===id);
  const swapIdx = idx + delta;
  if(idx < 0 || swapIdx < 0 || swapIdx >= list.length) return;
  [list[idx], list[swapIdx]] = [list[swapIdx], list[idx]];
  await saveDocumentos();
  const proj = PROJECTS.find(x=>x.id===projectId);
  if(proj) renderPanelContent(proj);
}

async function deleteDoc(projectId, id){
  if(!confirm('¿Eliminar este acceso? El archivo real en Drive no se borra, solo el enlace guardado acá.')) return;
  documentos[projectId] = (documentos[projectId] || []).filter(x=>x.id!==id);
  await saveDocumentos();
  const proj = PROJECTS.find(x=>x.id===projectId);
  if(proj) renderPanelContent(proj);
}

/* ---------- Modal de agregar/editar acceso ---------- */
const docModal = document.getElementById('doc-modal');
const docScrim = document.getElementById('doc-scrim');
let docModalProjectId = null;
let docModalEditId = null;

function openDocModal(projectId, editId){
  docModalProjectId = projectId;
  docModalEditId = editId;

  const titleEl = document.getElementById('doc-modal-title');
  const typeEl = document.getElementById('doc-type');
  const nameEl = document.getElementById('doc-name');
  const urlEl = document.getElementById('doc-url');
  const categoryEl = document.getElementById('doc-category');
  const descEl = document.getElementById('doc-description');

  if(editId){
    const item = (documentos[projectId]||[]).find(x=>x.id===editId);
    titleEl.textContent = 'Editar acceso';
    typeEl.value = item ? item.type : 'documento';
    nameEl.value = item ? item.name : '';
    urlEl.value = item ? item.url : '';
    categoryEl.value = (item && item.category) || '';
    descEl.value = (item && item.description) || '';
  } else {
    titleEl.textContent = 'Agregar acceso';
    typeEl.value = 'documento';
    nameEl.value = '';
    urlEl.value = '';
    categoryEl.value = '';
    descEl.value = '';
  }

  docModal.classList.add('open');
  docScrim.classList.add('open');
  docModal.setAttribute('aria-hidden', 'false');
  setTimeout(()=> nameEl.focus(), 60);
}

function closeDocModal(){
  docModal.classList.remove('open');
  docScrim.classList.remove('open');
  docModal.setAttribute('aria-hidden', 'true');
  docModalProjectId = null;
  docModalEditId = null;
}

document.getElementById('doc-cancel').addEventListener('click', closeDocModal);
docScrim.addEventListener('click', closeDocModal);
document.addEventListener('keydown', e=>{ if(e.key === 'Escape' && docModal.classList.contains('open')) closeDocModal(); });

document.getElementById('doc-save').addEventListener('click', async ()=>{
  const name = document.getElementById('doc-name').value.trim();
  const url = document.getElementById('doc-url').value.trim();
  if(!name || !url){
    if(!name) document.getElementById('doc-name').focus();
    else document.getElementById('doc-url').focus();
    return;
  }
  const type = document.getElementById('doc-type').value;
  const category = document.getElementById('doc-category').value.trim();
  const description = document.getElementById('doc-description').value.trim();

  const projectId = docModalProjectId;
  if(!documentos[projectId]) documentos[projectId] = [];

  if(docModalEditId){
    const item = documentos[projectId].find(x=>x.id===docModalEditId);
    if(item){
      item.type = type; item.name = name; item.url = url;
      item.category = category || null; item.description = description || null;
    }
  } else {
    documentos[projectId].push({
      id: 'doc_' + Date.now() + '_' + Math.random().toString(36).slice(2,7),
      type, name, url,
      category: category || null,
      description: description || null
    });
  }

  await saveDocumentos();
  closeDocModal();
  const proj = PROJECTS.find(x=>x.id===projectId);
  if(proj) renderPanelContent(proj);
});
